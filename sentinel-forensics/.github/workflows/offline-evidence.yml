name: Offline evidence validation
on:
  pull_request:
  push:
    branches: [main, 'feat/offline-analysis-program']
permissions:
  contents: read
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install independent local decoders and development schema validator
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends tshark
          python -m pip install 'jsonschema==4.26.0'
      - name: Run synthetic regressions and independent decoder comparisons
        run: python tools/evidence_lab/run_tests.py
      - name: Check exchange schema reproducibility
        working-directory: tools/evidence_lab
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from contract import schema
          assert json.loads(Path('schemas/honeytrace-v1.schema.json').read_bytes()) == schema()
          PY
