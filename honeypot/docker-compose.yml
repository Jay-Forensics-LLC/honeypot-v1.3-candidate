name: honeypot
x-common: &common
  # Supervised beta: Docker must not execute images before reviewed startup gates.
  restart: "no"
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]
  logging:
    driver: json-file
    options: {max-size: "10m", max-file: "3"}
  pids_limit: 256
  read_only: true
  tmpfs: ["/tmp:rw,nosuid,nodev,noexec,size=128m,mode=1777"]
  group_add: ["2000"]
services:
  cowrie:
    <<: *common
    image: ${COWRIE_IMAGE:-cowrie/cowrie:3.1.3@sha256:69e3317c6ecf8811d18faecb8a2fcedee0af1f0f864b50de07b688c7409f515c}
    container_name: honeypot-cowrie
    user: "999:2000"
    mem_limit: 768m
    cpus: 1.0
    environment: {TZ: UTC}
    networks: [cowrie]
    dns:
      - 172.29.40.254
    dns_opt:
      - timeout:1
      - attempts:1
    ports:
      - "${DECOY_BIND:-127.0.0.1}:${COWRIE_SSH_PORT:-2222}:2222"
      - "${DECOY_BIND:-127.0.0.1}:${COWRIE_TELNET_PORT:-2223}:2223"
    volumes:
      - ./configs/cowrie/cowrie.cfg:/cowrie/cowrie-git/etc/cowrie.cfg:ro
      - ./state/cowrie:/cowrie/cowrie-git/var/lib/cowrie
      - ./logs/cowrie:/cowrie/cowrie-git/var/log/cowrie
      - ${ARTIFACT_PATH:-./artifacts}/cowrie:/evidence
    healthcheck:
      test: [CMD, /cowrie/cowrie-env/bin/python3, -c, "import socket; socket.create_connection(('127.0.0.1',2222),3).close()"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 30s
  opencanary:
    <<: *common
    build:
      context: .
      dockerfile: docker/opencanary.Dockerfile
      args: {PYTHON_IMAGE: "${PYTHON_IMAGE:-python:3.12.13-slim-bookworm@sha256:4766d8b510c428e595d74b9cc5bbb2fae8e26316fffb4adc89908d79aacd58a2}"}
    image: honeypot-opencanary:0.9.10-local
    container_name: honeypot-opencanary
    user: "10002:2000"
    mem_limit: 384m
    cpus: 0.5
    environment: {TZ: UTC, HOME: /tmp}
    networks: [canary]
    dns:
      - 172.29.41.254
    dns_opt:
      - timeout:1
      - attempts:1
    ports:
      - "${DECOY_BIND:-127.0.0.1}:${CANARY_HTTP_PORT:-8080}:8080"
      - "${DECOY_BIND:-127.0.0.1}:${CANARY_FTP_PORT:-2121}:2121"
      # Redis stays loopback even if DECOY_BIND is a WAN address. See configs/wan/port-matrix.yml.
      - "127.0.0.1:${CANARY_REDIS_PORT:-16379}:16379"
    volumes:
      - ./configs/opencanary/opencanary.conf:/etc/opencanaryd/opencanary.conf:ro
      - ./logs/opencanary:/logs
    healthcheck:
      test: [CMD, python, -c, "import socket; socket.create_connection(('127.0.0.1',8080),3).close()"]
      interval: 60s
      timeout: 5s
      retries: 3
  suricata:
    <<: *common
    build:
      context: .
      dockerfile: docker/suricata.Dockerfile
      args: {UBUNTU_IMAGE: "${UBUNTU_IMAGE:-ubuntu:24.04@sha256:008173c23f95b170204355c12626cb5a965d779a7e1283b09e9cffbb1bf33ca3}"}
    image: honeypot-suricata:ubuntu24.04-local
    container_name: honeypot-suricata
    network_mode: host
    cap_add: [NET_RAW, NET_ADMIN, SETUID, SETGID]
    group_add: ["2000"]
    mem_limit: 2g
    cpus: 2.0
    command: [suricata, -c, /etc/suricata/suricata.yaml, --af-packet, --pidfile, /tmp/suricata.pid]
    volumes:
      - ./configs/suricata/suricata.yaml:/etc/suricata/suricata.yaml:ro
      - ./detections/suricata:/rules:ro
      - ./logs/suricata:/var/log/suricata
    healthcheck:
      test: [CMD-SHELL, 'test -s /tmp/suricata.pid && kill -0 "$$(cat /tmp/suricata.pid)"']
      interval: 30s
      timeout: 5s
      retries: 3
  loki:
    <<: *common
    image: ${LOKI_IMAGE:-grafana/loki:3.7.9@sha256:0db216b630ae1f348a1584c67f3cead8b4c1fc839169a39501db664744158e28}
    container_name: honeypot-loki
    user: "10001:2000"
    mem_limit: 2g
    cpus: 1.5
    command: [-config.file=/etc/loki/config.yml, -config.expand-env=true]
    environment: {LOKI_RETENTION_HOURS: "${LOKI_RETENTION_HOURS:-336}"}
    networks: [observability]
    volumes:
      - ./configs/loki/config.yml:/etc/loki/config.yml:ro
      - ./state/loki:/loki
    healthcheck:
      # Loki's minimal image has no curl/shell. Availability is tested by healthcheck.py.
      test: [CMD, /usr/bin/loki, -config.file=/etc/loki/config.yml, -config.expand-env=true, -verify-config=true]
      interval: 120s
      timeout: 15s
      retries: 3
  alloy:
    <<: *common
    image: ${ALLOY_IMAGE:-grafana/alloy:v1.14.1@sha256:8f5666aebb871ba43ee2d65159c5d1c26c903720efafaf2d9ed4e237afc3bc88}
    container_name: honeypot-alloy
    user: "10001:2000"
    mem_limit: 512m
    cpus: 0.5
    command: [run, --storage.path=/var/lib/alloy, --server.http.listen-addr=0.0.0.0:12345, /etc/alloy/config.alloy]
    networks: [observability]
    volumes:
      - ./configs/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - ./logs:/logs:ro
      - ./state/alloy:/var/lib/alloy
    healthcheck:
      test: [CMD, /bin/alloy, validate, /etc/alloy/config.alloy]
      interval: 120s
      timeout: 15s
      retries: 3
  grafana:
    <<: *common
    image: ${GRAFANA_IMAGE:-grafana/grafana:12.4.1@sha256:e932bd6ed0e026595b08483cd0141e5103e1ab7ff8604839ff899b8dc54cabcb}
    container_name: honeypot-grafana
    user: "472:2000"
    mem_limit: 512m
    cpus: 0.5
    networks: [observability, management]
    ports: ["${MANAGEMENT_BIND:-127.0.0.1}:${GRAFANA_PORT:-3000}:3000"]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
    secrets: [grafana_admin_password]
    volumes:
      - ./configs/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./dashboards:/var/lib/grafana/dashboards:ro
      - ./state/grafana:/var/lib/grafana
    healthcheck:
      test: [CMD-SHELL, 'wget -q -O /dev/null http://127.0.0.1:3000/api/health']
      interval: 30s
      timeout: 5s
      retries: 3
  incidentd:
    <<: *common
    build:
      context: .
      dockerfile: docker/incidentd.Dockerfile
      args: {PYTHON_IMAGE: "${PYTHON_IMAGE:-python:3.12.13-slim-bookworm@sha256:4766d8b510c428e595d74b9cc5bbb2fae8e26316fffb4adc89908d79aacd58a2}"}
    image: honeypot-incidentd:v1-local
    container_name: honeypot-incidentd
    user: "10001:2000"
    mem_limit: 512m
    cpus: 1.0
    networks: [observability]
    environment:
      HP_ROOT: /hp
      PYTHONDONTWRITEBYTECODE: "1"
      CORRELATION_WINDOW_SECONDS: "${CORRELATION_WINDOW_SECONDS:-900}"
    volumes:
      - ./logs:/hp/logs
      - ${ARTIFACT_PATH:-./artifacts}:/hp/artifacts
      - ${INCIDENT_PATH:-./incidents}:/hp/incidents
      - ${PCAP_PATH:-./captures}:/hp/captures:ro
      - ./state/incidentd:/hp/state/incidentd
      - ./state/bait:/hp/state/bait:ro
      - ./state/trusted/boundary.jsonl:/hp/trusted/boundary.jsonl:ro
      - ./detections:/hp/detections:ro
    healthcheck:
      test: [CMD, python, -c, "import pathlib,time; assert time.time()-pathlib.Path('/hp/state/incidentd/heartbeat').stat().st_mtime < 90"]
      interval: 30s
      timeout: 5s
      retries: 3
networks:
  cowrie:
    name: honeypot-cowrie-net
    internal: false
    enable_ipv6: false
    driver_opts: {com.docker.network.bridge.name: br-hp-cowrie}
    ipam: {config: [{subnet: 172.29.40.0/24}]}
  canary:
    name: honeypot-canary-net
    internal: false
    enable_ipv6: false
    driver_opts: {com.docker.network.bridge.name: br-hp-canary}
    ipam: {config: [{subnet: 172.29.41.0/24}]}
  observability:
    name: honeypot-observability
    internal: true
    enable_ipv6: false
    ipam: {config: [{subnet: 172.29.42.0/24}]}
  management:
    name: honeypot-management
    internal: false
    enable_ipv6: false
    driver_opts: {com.docker.network.bridge.name: br-hp-mgmt}
    ipam: {config: [{subnet: 172.29.43.0/24}]}
secrets:
  grafana_admin_password:
    file: ./secrets/grafana_admin_password
