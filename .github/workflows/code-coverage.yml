name: Offline unittest coverage

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unittest-coverage:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install offline test tools
        id: dependencies
        run: |
          python -m pip install PyYAML==6.0.2 coverage==7.16.2
          mkdir -p "$RUNNER_TEMP/coverage/reports"
          echo "COVERAGE_FILE=$RUNNER_TEMP/coverage/.coverage" >> "$GITHUB_ENV"

      # Run the existing unittest entrypoints directly: covering make or the
      # baseline validator alone would miss tests launched in child processes.
      # Separate steps retain failures while allowing the other suites to run.
      - name: Measure validator unit tests
        id: validators
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: |
          python -B -m coverage run --parallel-mode -m unittest discover -s tools/tests -v 2>&1 | tee "$RUNNER_TEMP/coverage/reports/validator-tests.log"
      - name: Measure retained Stage 7 offline tests
        id: stage7
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: |
          python -B -m coverage run --parallel-mode honeypot/scripts/stage7_tests.py 2>&1 | tee "$RUNNER_TEMP/coverage/reports/stage7-tests.log"
      - name: Measure application unit tests
        id: application
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: |
          python -B -m coverage run --parallel-mode -m unittest discover -s honeypot/tests -v 2>&1 | tee "$RUNNER_TEMP/coverage/reports/application-tests.log"

      - name: Build readable coverage reports
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: |
          python -B -m coverage combine --keep
          python -B -m coverage report > "$RUNNER_TEMP/coverage/reports/coverage.txt"
          python -B -m coverage xml -o "$RUNNER_TEMP/coverage/reports/coverage.xml"
          python -B -m coverage json -o "$RUNNER_TEMP/coverage/reports/coverage.json"
          python -B -m coverage html -d "$RUNNER_TEMP/coverage/reports/html"
          {
            echo '## Offline Python coverage'
            echo 'Validator tests: ${{ steps.validators.outcome }}'
            echo 'Retained Stage 7 tests: ${{ steps.stage7.outcome }}'
            echo 'Application tests: ${{ steps.application.outcome }}'
            echo ''
            echo 'Scope: Python in honeypot/scripts, retained qualification helpers, and tools; test/fixture files excluded.'
            echo 'Only the three direct runners and in-process imports are instrumented. Child Python/shell processes, Docker services, and live qualification are not measured.'
            echo 'Skipped tests remain skipped. Coverage adds no release threshold and does not pass Stage 7/8 gates.'
            echo 'Download the artifact and open html/index.html for annotated source, or read coverage.txt and the suite logs.'
            echo ''
            echo '```text'
            cat "$RUNNER_TEMP/coverage/reports/coverage.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage reports and test logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: offline-unittest-coverage-python312
          path: ${{ runner.temp }}/coverage/reports/
          if-no-files-found: error
          retention-days: 14
