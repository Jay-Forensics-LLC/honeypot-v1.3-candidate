name: Source baseline validation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  offline-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6, Node.js 24
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6, Node.js 24
        with:
          python-version: '3.12'
      - run: python -m pip install PyYAML==6.0.2
      - run: python -B tools/validate_baseline.py
